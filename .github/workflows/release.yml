name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.3). A v-prefixed tag will be created.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Compute version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${REF_NAME#v}}"
          if [[ ! "$version" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use MAJOR.MINOR.PATCH format with a major version of at least 1."
            printf 'Received version: %q\n' "$version"
            exit 1
          fi
          echo "package_version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        shell: bash
        run: ./gradlew :shared:allTests

  package:
    name: Build ${{ matrix.artifact }}
    needs: [prepare, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: AppImage
            package_task: ':desktopApp:packageReleaseAppImage'
          - os: macos-latest
            artifact: Dmg
            package_task: ':desktopApp:packageReleaseDmg'
          - os: windows-latest
            artifact: Exe
            package_task: ':desktopApp:packageReleaseExe'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Package ${{ matrix.artifact }}
        env:
          PACKAGE_TASK: ${{ matrix.package_task }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew "$PACKAGE_TASK" "-PpackageVersion=$PACKAGE_VERSION"

      - name: Build AppImage from app dir
        if: matrix.os == 'ubuntu-latest'
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="$PACKAGE_VERSION"
          APP_DIR=desktopApp/build/compose/binaries/main-release/app/logcruiser
          curl --fail --location --retry 3 -o /tmp/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          mkdir -p AppDir
          cp -r "$APP_DIR"/. AppDir/
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          SELF="$(dirname "$(readlink -f "$0")")"
          exec "$SELF/bin/logcruiser" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/logcruiser.desktop <<EOF
          [Desktop Entry]
          Name=LogCruiser
          Comment=Log file viewer
          Exec=logcruiser
          Icon=logcruiser
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF
          test -f "$APP_DIR/lib/logcruiser.png"
          cp "$APP_DIR/lib/logcruiser.png" AppDir/logcruiser.png
          mkdir -p dist
          APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool AppDir dist/logcruiser-$VERSION.AppImage

      - name: Dump packaging logs on failure
        if: failure()
        shell: bash
        run: |
          if [[ -d desktopApp/build/compose/logs ]]; then
            find desktopApp/build/compose/logs -type f \
              \( -name '*-err.txt' -o -name '*-out.txt' \) \
              -print -exec sh -c 'echo "=== $1 ==="; tail -n 200 "$1"' _ {} \;
          else
            echo "No Compose packaging logs were produced."
          fi

      - name: Collect installer
        env:
          ARTIFACT: ${{ matrix.artifact }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          case "$ARTIFACT" in
            AppImage)
              test -f "dist/logcruiser-$PACKAGE_VERSION.AppImage"
              ;;
            Dmg)
              find desktopApp/build/compose/binaries/main-release/dmg -type f \
                -iname '*.dmg' -exec cp {} dist/ \;
              ;;
            Exe)
              find desktopApp/build/compose/binaries/main-release/exe -type f \
                -iname '*.exe' -exec cp {} dist/ \;
              ;;
            *)
              echo "::error::Unsupported artifact: $ARTIFACT"
              exit 1
              ;;
          esac
          echo "--- contents of dist ---"
          ls -la dist
          if [[ -z "$(find dist -type f -print -quit)" ]]; then
            echo "::error::No installer file produced. See the file listing above."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installer-*
          merge-multiple: true

      - name: List installers
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: dist/**
          generate_release_notes: true
