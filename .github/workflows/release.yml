name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.3). A v-prefixed tag will be created.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: AppImage
          - os: macos-latest
            artifact: Dmg
          - os: windows-latest
            artifact: Exe
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "package_version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "package_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        shell: bash
        run: ./gradlew build

      - name: Package ${{ matrix.artifact }}
        shell: bash
        run: ./gradlew packageReleaseDistributionForCurrentOS -PpackageVersion=${{ steps.version.outputs.package_version }}

      - name: Build AppImage from app dir
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euxo pipefail
          VERSION=${{ steps.version.outputs.package_version }}
          APP_DIR=desktopApp/build/compose/binaries/main-release/app/logcruiser
          curl -L -o /tmp/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          mkdir -p AppDir
          cp -r "$APP_DIR"/. AppDir/
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          SELF="$(dirname "$(readlink -f "$0")")"
          exec "$SELF/bin/logcruiser" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/logcruiser.desktop <<EOF
          [Desktop Entry]
          Name=LogCruiser
          Comment=Log file viewer
          Exec=logcruiser
          Icon=logcruiser
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF
          cp "$APP_DIR/lib/logcruiser.png" AppDir/logcruiser.png
          mkdir -p dist
          APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool AppDir dist/logcruiser-$VERSION.AppImage

      - name: Dump packaging logs on failure
        if: failure()
        shell: bash
        run: |
          find desktopApp/build/compose/logs -type f \
            \( -name '*-err.txt' -o -name '*-out.txt' \) \
            -print -exec sh -c 'echo "=== $1 ==="; tail -n 200 "$1"' _ {} \;

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p dist
          echo "--- files under desktopApp/build/compose/binaries ---"
          find desktopApp/build/compose/binaries -type f -print
          find desktopApp/build/compose/binaries -type f \
            \( -iname '*.appimage' -o -iname '*.dmg' -o -iname '*.exe' \) \
            -exec cp {} dist/ \;
          echo "--- contents of dist ---"
          ls -la dist
          if [[ -z "$(find dist -type f -print -quit)" ]]; then
            echo "::error::No installer file produced. See the file listing above."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installer-*
          merge-multiple: true

      - name: List installers
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: dist/**
          generate_release_notes: true
